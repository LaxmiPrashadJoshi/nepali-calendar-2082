<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>नेपाली पात्रो 2082</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@500&family=Mukta:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fdfaf6;
      font-family: 'Mukta', sans-serif;
    }
    .calendar td {
      height: 100px;
      vertical-align: top;
      font-size: 22px;
      padding: 5px;
      background-color: #fff;
      transition: background-color 0.3s;
      font-family: 'Khand', sans-serif;
    }
    .calendar td:hover {
      background-color: #e7f3ff;
      cursor: pointer;
    }
    .table-bordered th {
      background-color: #ffefd5;
      color: #333;
      text-align: center;
      font-size: 24px;
      font-family: 'Khand', sans-serif;
    }
    .calendar td strong {
      display: block;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      margin: auto;
      font-size: 22px;
    }
    .calendar .saturday strong {
      background-color: #f8d7da;
      color: #b02a37;
    }
    .calendar td:not(.saturday) strong {
      background-color: #e1f5c4;
      color: #2e7d32;
    }
    .btn-primary {
      background-color: #8e44ad;
      border-color: #8e44ad;
    }
    .btn-primary:hover {
      background-color: #732d91;
    }
    h1 {
      color: #c0392b;
      font-family: 'Khand', sans-serif;
    }
    .month-box {
      background-color: #f0e9ff;
      border: 2px solid #b197fc;
      border-radius: 15px;
      padding: 10px 25px;
      margin: 10px auto;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      color: #4b0082;
      font-size: 28px;
      font-family: 'Khand', sans-serif;
    }
    footer {
      background-color: #f0f0f0;
      padding: 10px;
      text-align: center;
      color: #666;
      margin-top: 40px;
      font-family: 'Mukta', sans-serif;
    }
  </style>
</head>
<body>

<div class="container my-5 text-center">
  <h1 class="mb-4">नेपाली पात्रो</h1>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-primary" onclick="prevMonth()">⬅ अघिल्लो</button>
    <div id="monthName" class="month-box"></div>
    <button class="btn btn-primary" onclick="nextMonth()">अर्को ➡</button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered calendar">
      <thead class="table-light">
        <tr>
          <th>आइत</th>
          <th>सोम</th>
          <th>मंगल</th>
          <th>बुध</th>
          <th>बिही</th>
          <th>शुक्र</th>
          <th>शनि</th>
        </tr>
      </thead>
      <tbody id="calendarBody"></tbody>
    </table>
  </div>
</div>

<footer>
  © लक्ष्मीप्रसाद जोशी
</footer>

<script>
  const months = [
    { name: "बैशाख", days: 31 },
    { name: "जेठ", days: 31 },
    { name: "असार", days: 32 },
    { name: "श्रावण", days: 31 },
    { name: "भदौ", days: 31 },
    { name: "आश्विन", days: 30 },
    { name: "कार्तिक", days: 30 },
    { name: "मंसिर", days: 29 },
    { name: "पौष", days: 29 },
    { name: "माघ", days: 30 },
    { name: "फाल्गुण", days: 30 },
    { name: "चैत्र", days: 30 }
  ];

  let currentMonth = 0;

  const nepaliNumbers = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

  function toNepali(num) {
    return num.toString().split('').map(d => nepaliNumbers[parseInt(d)]).join('');
  }

  function renderCalendar(monthIndex) {
    const month = months[monthIndex];
    document.getElementById('monthName').textContent = `${month.name} २०८२`;

    const tbody = document.getElementById('calendarBody');
    tbody.innerHTML = "";

    const firstDay = new Date(2025, monthIndex, 1).getDay();
    let date = 1;
    let weeks = Math.ceil((firstDay + month.days) / 7);

    for (let i = 0; i < weeks; i++) {
      let row = document.createElement("tr");

      for (let j = 0; j < 7; j++) {
        let cell = document.createElement("td");

        if (i === 0 && j < firstDay) {
          cell.innerHTML = "";
        } else if (date <= month.days) {
          const isSaturday = j === 6;
          cell.className = isSaturday ? "saturday" : "";
          cell.innerHTML = `<strong>${toNepali(date)}</strong>`;
          date++;
        } else {
          cell.innerHTML = "";
        }

        row.appendChild(cell);
      }
      tbody.appendChild(row);
    }
  }

  function nextMonth() {
    if (currentMonth < 11) {
      currentMonth++;
      renderCalendar(currentMonth);
    }
  }

  function prevMonth() {
    if (currentMonth > 0) {
      currentMonth--;
      renderCalendar(currentMonth);
    }
  }

  renderCalendar(currentMonth);
</script>

</body>
</html>
